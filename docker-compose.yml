services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: latam_trainer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d latam_trainer"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NGINX_CONFIG: nginx.local.conf
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data: